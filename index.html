<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three Mister Image Transformation</title>
    <meta name="description" content="Professional image transformation and artistic styling powered by Three Mister and Gemini AI." />
    <meta property="og:title" content="Three Mister Image Transformation" />
    <meta property="og:description" content="Professional image transformation and artistic styling powered by Three Mister and Gemini AI." />
    <meta property="og:image" content="./logo.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #030712; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px;">
        <div style="text-align: center; max-width: 360px; width: 100%;">
          <div style="width: 52px; height: 52px; background: #580001; border-radius: 14px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(88,0,1,0.5); padding: 8px;">
            <img src="./logo.png" alt="Three Mister" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 6px 0; letter-spacing: -0.01em; color: #ffffff;">Three Mister</h2>
          <p style="font-size: 13px; color: #94a3b8; margin: 0 0 20px 0; line-height: 1.4;">Studio Transformasi AI</p>
          <div style="width: 140px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 999px; margin: 0 auto; overflow: hidden; position: relative;">
            <div style="width: 50%; height: 100%; background: #ef4444; border-radius: 999px; position: absolute; animation: loaderMove 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes loaderMove {
          0% { left: -50%; width: 30%; }
          50% { width: 60%; }
          100% { left: 100%; width: 30%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
